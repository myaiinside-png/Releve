<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2a2e">
<title>Relève</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{
    --paper:#ECEEEF; --card:#F6F7F7; --ink:#1C2A2E; --slate:#3E5257;
    --mut:#6E7C7E; --line:#CBD1D0; --verdigris:#2A6F6A; --verd-d:#215854;
    --alert:#B23A2E; --amber:#B0721B; --ok:#2A6F6A;
    --r:14px; --pad:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font:inherit;color:var(--ink)}
  .hidden{display:none!important}

  /* App shell */
  header.top{
    position:sticky;top:0;z-index:20;background:var(--ink);color:#EAF0EF;
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  header.top .brand{display:flex;align-items:baseline;gap:8px}
  header.top .brand b{font-size:19px;letter-spacing:.02em}
  header.top .brand span{font-size:11px;color:#8FB0AC;letter-spacing:.14em;text-transform:uppercase}
  .iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#CFDCDA}
  .iconbtn:active{background:#2b3d41}

  main{max-width:720px;margin:0 auto;padding:16px 14px 90px}

  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:var(--card);border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabs button{flex:1;padding:9px 4px 11px;display:flex;flex-direction:column;
    align-items:center;gap:3px;color:var(--mut);font-size:11px;letter-spacing:.02em}
  nav.tabs button.active{color:var(--verdigris)}
  nav.tabs svg{width:23px;height:23px}

  /* Cards & bits */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad)}
  .card + .card{margin-top:12px}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
  .muted{color:var(--mut)}
  .btn{background:var(--verdigris);color:#fff;padding:13px 16px;border-radius:11px;
    font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{background:var(--verd-d)}
  .btn.ghost{background:transparent;color:var(--verdigris);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--alert);border:1px solid #E3C4BF}
  .btn.sm{padding:9px 12px;width:auto;font-size:14px;border-radius:9px}
  .row{display:flex;gap:8px;align-items:center}
  .field{margin-top:12px}
  .field label{display:block;font-size:13px;color:var(--slate);margin-bottom:5px;font-weight:600}
  .field input,.field textarea,.field select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .field textarea{min-height:70px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* Alert chips on a patient */
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;
    padding:4px 9px;border-radius:999px;border:1px solid;line-height:1.2}
  .chip.red{color:var(--alert);border-color:#E3C4BF;background:#FBF0EE}
  .chip.amber{color:var(--amber);border-color:#E6D5B4;background:#FBF5E9}
  .chip.info{color:var(--verd-d);border-color:#BBD6D2;background:#EAF3F1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

  /* THE THREAD — la tournée */
  .thread{list-style:none;margin:14px 0 0;padding:0;position:relative}
  .thread::before{content:"";position:absolute;left:15px;top:8px;bottom:24px;
    width:2px;background:repeating-linear-gradient(var(--verdigris) 0 6px,transparent 6px 12px)}
  .stop{position:relative;padding:0 0 14px 40px;min-height:34px}
  .stop .bead{position:absolute;left:8px;top:2px;width:18px;height:18px;border-radius:50%;
    background:var(--paper);border:2px solid var(--verdigris);
    display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--verd-d)}
  .stop .who{font-weight:650}
  .stop .meta{font-size:13px;color:var(--mut)}
  .stop .actions{display:flex;gap:4px;margin-top:6px}
  .stop .actions button{padding:5px 9px;border:1px solid var(--line);border-radius:8px;
    font-size:12.5px;color:var(--slate);background:#fff}

  /* Transmission timeline */
  .tl{margin-top:10px}
  .tx{border-left:3px solid var(--line);padding:2px 0 12px 12px;margin-left:2px}
  .tx .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .tx .h b{font-size:14px}
  .tx .h time{font-size:12px;color:var(--mut)}
  .tx p{margin:5px 0 0;white-space:pre-wrap}
  .tx audio{margin-top:8px;width:100%;height:38px}

  /* list rows */
  .listrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .listrow:last-child{border-bottom:none}
  .listrow .av{width:38px;height:38px;border-radius:10px;background:#DCE6E4;color:var(--verd-d);
    display:grid;place-items:center;font-weight:700;flex:none}
  .listrow .nm{font-weight:600}
  .listrow .sub{font-size:13px;color:var(--mut)}
  .listrow .go{margin-left:auto;color:var(--mut)}

  /* record button */
  .rec{width:52px;height:52px;border-radius:50%;flex:none;border:2px solid var(--line);
    background:#fff;display:grid;place-items:center;color:var(--slate)}
  .rec.on{border-color:var(--alert);color:var(--alert);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(178,58,46,.35)}50%{box-shadow:0 0 0 8px rgba(178,58,46,0)}}
  @media (prefers-reduced-motion:reduce){.rec.on{animation:none}}

  #map{height:300px;border-radius:12px;border:1px solid var(--line);margin-top:12px}
  .empty{text-align:center;color:var(--mut);padding:34px 16px}
  .empty svg{width:40px;height:40px;opacity:.5;margin-bottom:8px}

  /* Unlock */
  #gate{position:fixed;inset:0;z-index:60;background:var(--ink);color:#EAF0EF;
    display:flex;flex-direction:column;justify-content:center;padding:26px;gap:6px}
  #gate .cord{width:2px;height:70px;margin:0 auto 18px;
    background:repeating-linear-gradient(#5f8a85 0 6px,transparent 6px 12px)}
  #gate h1{font-size:30px;text-align:center;letter-spacing:.03em}
  #gate p{text-align:center;color:#8FB0AC;margin:4px 0 22px}
  #gate input{width:100%;padding:14px;border-radius:12px;border:1px solid #38494d;
    background:#16232700;background:#182427;color:#fff;text-align:center;font-size:17px;letter-spacing:.05em}
  #gate .btn{margin-top:14px}
  #gate small{display:block;text-align:center;color:#6f8481;margin-top:18px;line-height:1.5}
  .err{color:#E9A79F;text-align:center;min-height:20px;font-size:14px;margin-top:8px}

  /* sheet / modal */
  .sheet-bg{position:fixed;inset:0;z-index:40;background:#1c2a2eaa;display:flex;align-items:flex-end}
  .sheet{background:var(--paper);width:100%;max-width:720px;margin:0 auto;border-radius:18px 18px 0 0;
    max-height:92vh;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .sheet .grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
  .sheet h2{font-size:20px;margin-bottom:2px}
  .sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
</style>
</head>
<body>

<!-- ============ GATE / DÉVERROUILLAGE ============ -->
<div id="gate">
  <div class="cord"></div>
  <h1>Relève</h1>
  <p id="gateSub">Phrase secrète du cabinet</p>
  <input id="pass" type="password" inputmode="text" autocomplete="off"
         placeholder="•••••••••••" enterkeyhint="go">
  <input id="pass2" class="hidden" type="password" autocomplete="off" placeholder="Confirmer" style="margin-top:10px">
  <div class="err" id="gateErr"></div>
  <button class="btn" id="gateBtn">Ouvrir</button>
  <small>Tout est chiffré sur cet appareil avec cette phrase.<br>
  Personne d'autre — pas même l'hébergeur — ne peut la lire. Notez-la : sans elle, les données sont irrécupérables.</small>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><b>Relève</b><span id="cabName">cabinet</span></div>
    <div class="row">
      <button class="iconbtn" id="menuBtn" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </button>
      <button class="iconbtn" id="lockBtn" title="Verrouiller">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="view-tournee"></section>
    <section id="view-patients" class="hidden"></section>
  </main>

  <nav class="tabs">
    <button data-tab="tournee" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
      Tournée
    </button>
    <button data-tab="patients">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.8M17 20a5.5 5.5 0 0 0-3-4.9"/></svg>
      Patients
    </button>
  </nav>
</div>

<!-- sheet host -->
<div id="sheetHost"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* =========================================================================
   Relève — v1 (palier A : local-first, souverain, partage par bundle chiffré)
   Aucune donnée ne quitte l'appareil sauf via un export chiffré volontaire.
   ========================================================================= */

/* ---------- Crypto (WebCrypto : PBKDF2 -> AES-GCM 256) ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = (buf)=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptJSON(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = enc.encode(JSON.stringify(obj));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, data);
  return {iv:b64(iv), ct:b64(ct)};
}
async function decryptJSON(key, iv, ct){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(iv)}, key, unb64(ct));
  return JSON.parse(dec.decode(pt));
}
async function encryptBytes(key, bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes);
  return {iv:b64(iv), ct:b64(ct)};
}
async function decryptBytes(key, iv, ct){
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(iv)}, key, unb64(ct)));
}

/* ---------- Stockage local (IndexedDB) ---------- */
const DB='releve', STORES=['meta','state','audio'];
function idb(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)});};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
});}
async function idbGet(store,k){const d=await idb();return new Promise((res,rej)=>{
  const t=d.transaction(store,'readonly').objectStore(store).get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
async function idbSet(store,k,v){const d=await idb();return new Promise((res,rej)=>{
  const t=d.transaction(store,'readwrite');t.objectStore(store).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function idbKeys(store){const d=await idb();return new Promise((res,rej)=>{
  const t=d.transaction(store,'readonly').objectStore(store).getAllKeys();t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}

/* ---------- État en mémoire ---------- */
let KEY=null, PASS=null;               // effacés au verrouillage
let S = null;                          // état déchiffré
let saveTimer=null;

const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function blank(){return {patients:[],transmissions:[],tournees:[],settings:{cabinet:'',moi:''}};}

async function persist(){
  const {iv,ct}=await encryptJSON(KEY,S);
  await idbSet('state','main',{iv,ct});
}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(persist,300);}

/* ---------- Déverrouillage ---------- */
const gate=document.getElementById('gate'), app=document.getElementById('app');
const passEl=document.getElementById('pass'), pass2El=document.getElementById('pass2');
const gateErr=document.getElementById('gateErr'), gateBtn=document.getElementById('gateBtn'), gateSub=document.getElementById('gateSub');
let firstRun=false;

(async function initGate(){
  const existing = await idbGet('state','main').catch(()=>null);
  firstRun = !existing;
  if(firstRun){
    gateSub.textContent='Créer la phrase secrète du cabinet';
    pass2El.classList.remove('hidden');
    gateBtn.textContent='Créer le coffre';
  }
})();

gateBtn.onclick=unlock;
passEl.addEventListener('keydown',e=>{if(e.key==='Enter'){firstRun?pass2El.focus():unlock();}});
pass2El.addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});

async function unlock(){
  gateErr.textContent='';
  const p=passEl.value.trim();
  if(p.length<6){gateErr.textContent='Au moins 6 caractères.';return;}
  if(firstRun && p!==pass2El.value.trim()){gateErr.textContent='Les deux phrases diffèrent.';return;}
  try{
    let salt = await idbGet('meta','salt');
    if(!salt){salt=crypto.getRandomValues(new Uint8Array(16));await idbSet('meta','salt',salt);}
    const key=await deriveKey(p,salt);
    if(firstRun){
      S=blank(); KEY=key; PASS=p; await persist();
    }else{
      const st=await idbGet('state','main');
      S=await decryptJSON(key,st.iv,st.ct);   // lève si mauvaise phrase
      KEY=key; PASS=p;
    }
    passEl.value='';pass2El.value='';
    gate.classList.add('hidden');app.classList.remove('hidden');
    document.getElementById('cabName').textContent=S.settings.cabinet||'cabinet';
    render();
  }catch(e){gateErr.textContent='Phrase incorrecte.';}
}

document.getElementById('lockBtn').onclick=()=>{
  KEY=null;PASS=null;S=null;
  app.classList.add('hidden');gate.classList.remove('hidden');passEl.focus();
};

/* ---------- Navigation ---------- */
let TAB='tournee';
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  TAB=b.dataset.tab;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('active',x===b));
  document.getElementById('view-tournee').classList.toggle('hidden',TAB!=='tournee');
  document.getElementById('view-patients').classList.toggle('hidden',TAB!=='patients');
  render();
});

function render(){ TAB==='tournee'?renderTournee():renderPatients(); }
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=p=>((p.prenom||' ')[0]+(p.nom||' ')[0]).toUpperCase();
const patient=id=>S.patients.find(p=>p.id===id);
const todayISO=()=>new Date().toISOString().slice(0,10);

/* ======================= VUE TOURNÉE ======================= */
let curDate=todayISO();
function tourneeFor(d){return S.tournees.find(t=>t.date===d);}

function renderTournee(){
  const v=document.getElementById('view-tournee');
  const t=tourneeFor(curDate);
  const stops=t?t.stops:[];
  const dObj=new Date(curDate+'T00:00');
  const human=dObj.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

  v.innerHTML=`
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><div class="eyebrow">Tournée</div><h2 style="text-transform:capitalize">${human}</h2></div>
        <input type="date" id="dpick" value="${curDate}" style="padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff">
      </div>
      ${stops.length?`
      <ol class="thread">
        ${stops.map((pid,i)=>{const p=patient(pid);if(!p)return'';
          return `<li class="stop">
            <span class="bead">${i+1}</span>
            <div class="who">${esc(p.prenom)} ${esc(p.nom)}</div>
            <div class="meta mono">${esc(p.adresse||'—')}</div>
            ${alertChips(p,true)}
            <div class="actions">
              <button data-open="${p.id}">Fiche</button>
              <button data-up="${i}" ${i===0?'disabled':''}>▲</button>
              <button data-down="${i}" ${i===stops.length-1?'disabled':''}>▼</button>
              <button data-rm="${i}">Retirer</button>
            </div>
          </li>`;}).join('')}
      </ol>`:`
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>
        <div>Aucun arrêt pour ce jour.</div>
      </div>`}
      <button class="btn ghost" id="addStop" style="margin-top:12px">+ Ajouter un patient à la tournée</button>
    </div>
    <div class="card"><div class="eyebrow">Carte du fil</div><div id="map"></div>
      <div class="muted" style="font-size:12.5px;margin-top:8px">Les patients sans coordonnées (lat/lng dans la fiche) n'apparaissent pas encore sur la carte.</div>
    </div>`;

  document.getElementById('dpick').onchange=e=>{curDate=e.target.value;renderTournee();};
  document.getElementById('addStop').onclick=()=>pickPatientForTour();
  v.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPatient(b.dataset.open));
  v.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveStop(+b.dataset.up,-1));
  v.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveStop(+b.dataset.down,1));
  v.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const t=tourneeFor(curDate);t.stops.splice(+b.dataset.rm,1);save();renderTournee();});
  drawMap(stops);
}
function ensureTour(){let t=tourneeFor(curDate);if(!t){t={id:uid(),date:curDate,infirmier:S.settings.moi||'',stops:[]};S.tournees.push(t);}return t;}
function moveStop(i,dir){const t=tourneeFor(curDate);const j=i+dir;[t.stops[i],t.stops[j]]=[t.stops[j],t.stops[i]];save();renderTournee();}

let MAP=null,LAYER=null;
function drawMap(stops){
  const el=document.getElementById('map');if(!el||typeof L==='undefined')return;
  if(!MAP){MAP=L.map(el,{zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);MAP.setView([48.07,-4.60],11);} // Cap Sizun
  if(LAYER)LAYER.remove();LAYER=L.layerGroup().addTo(MAP);
  const pts=[];
  stops.forEach((pid,i)=>{const p=patient(pid);if(p&&p.lat&&p.lng){
    const ll=[+p.lat,+p.lng];pts.push(ll);
    L.marker(ll).addTo(LAYER).bindPopup(`<b>${i+1}. ${esc(p.prenom)} ${esc(p.nom)}</b>`);}});
  if(pts.length){L.polyline(pts,{color:'#2A6F6A',weight:3,dashArray:'2 8'}).addTo(LAYER);
    MAP.fitBounds(pts,{padding:[30,30],maxZoom:15});}
  setTimeout(()=>MAP.invalidateSize(),80);
}

/* ======================= VUE PATIENTS ======================= */
function renderPatients(){
  const v=document.getElementById('view-patients');
  const list=[...S.patients].sort((a,b)=>(a.nom||'').localeCompare(b.nom||''));
  v.innerHTML=`
    <div class="card">
      <div class="sheethead"><h2>Patients</h2>
        <button class="btn sm" id="newPat">+ Nouveau</button></div>
      ${list.length?list.map(p=>`
        <div class="listrow" data-open="${p.id}">
          <div class="av">${initials(p)}</div>
          <div><div class="nm">${esc(p.prenom)} ${esc(p.nom)}</div>
            <div class="sub mono">${esc(p.adresse||'—')}</div></div>
          <div class="go">›</div>
        </div>`).join(''):`<div class="empty">Aucun patient. Commencez par en créer un.</div>`}
    </div>`;
  document.getElementById('newPat').onclick=()=>editPatient(null);
  v.querySelectorAll('[data-open]').forEach(r=>r.onclick=()=>openPatient(r.dataset.open));
}

/* ---------- alertes ---------- */
const ALERT_KINDS={red:'Critique',amber:'Précaution',info:'Info'};
function alertChips(p,compact){
  const a=p.alertes||[];if(!a.length)return'';
  const show=compact?a.slice(0,3):a;
  return `<div class="chips">${show.map(x=>`<span class="chip ${x.niveau}">${esc(x.texte)}</span>`).join('')}${compact&&a.length>3?`<span class="chip info">+${a.length-3}</span>`:''}</div>`;
}

/* ======================= SHEETS ======================= */
function openSheet(html){
  const host=document.getElementById('sheetHost');
  host.innerHTML=`<div class="sheet-bg"><div class="sheet"><div class="grab"></div>${html}</div></div>`;
  const bg=host.querySelector('.sheet-bg');

/* ---- Fiche patient (lecture + transmissions) ---- */
async function openPatient(id){
  const p=patient(id);if(!p)return;
  const txs=S.transmissions.filter(t=>t.patientId===id).sort((a,b)=>b.createdAt-a.createdAt);
  const s=openSheet(`
    <div class="sheethead">
      <div><div class="eyebrow">Fiche</div><h2>${esc(p.prenom)} ${esc(p.nom)}</h2></div>
      <button class="btn sm ghost" id="editPat">Modifier</button>
    </div>
    ${alertChips(p)}
    <div class="card" style="margin-top:12px">
      ${infoLine('Adresse',p.adresse)}${infoLine('Code porte',p.codePorte)}
      ${infoLine('Contact famille',p.telFamille)}${infoLine('Pathologies',p.pathologies)}
      ${infoLine('Soins en cours',p.soins)}${infoLine('Notes',p.notes)}
    </div>

    <div class="sheethead" style="margin-top:18px"><h2 style="font-size:17px">Transmissions</h2></div>
    <div class="card">
      <div class="field" style="margin-top:0">
        <textarea id="txText" placeholder="Écrire une transmission…"></textarea>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="rec" id="recBtn" title="Mémo vocal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>
        </button>
        <span class="muted mono" id="recTime" style="min-width:52px">00:00</span>
        <button class="btn" id="saveTx" style="flex:1">Enregistrer</button>
      </div>
      <div id="recPreview"></div>
    </div>

    <div class="tl" id="txList">
      ${txs.length?'':'<div class="empty">Pas encore de transmission.</div>'}
    </div>`);

  s.querySelector('#editPat').onclick=()=>editPatient(id);
  await renderTxList(id, s.querySelector('#txList'), txs);
  wireRecorder(s, id);
}
function infoLine(label,val){if(!val)return'';return `<div style="margin-bottom:8px"><div class="eyebrow">${label}</div><div>${esc(val)}</div></div>`;}

async function renderTxList(pid, host, txs){
  host.innerHTML='';
  for(const t of txs){
    const div=document.createElement('div');div.className='tx';
    const when=new Date(t.createdAt).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    div.innerHTML=`<div class="h"><b>${esc(t.auteur||'—')}</b><time class="mono">${when}</time></div>
      ${t.texte?`<p>${esc(t.texte)}</p>`:''}`;
    if(t.audioId){
      try{const rec=await idbGet('audio',t.audioId);
        if(rec){const bytes=await decryptBytes(KEY,rec.iv,rec.ct);
          const url=URL.createObjectURL(new Blob([bytes],{type:rec.type||'audio/webm'}));
          const au=document.createElement('audio');au.controls=true;au.src=url;div.appendChild(au);}
      }catch(e){}
    }
    host.appendChild(div);
  }
}

/* ---- Enregistreur vocal ---- */
function wireRecorder(s, pid){
  const recBtn=s.querySelector('#recBtn'), recTime=s.querySelector('#recTime'),
        preview=s.querySelector('#recPreview'), saveBtn=s.querySelector('#saveTx'), txText=s.querySelector('#txText');
  let mr=null,chunks=[],pendingBlob=null,t0=0,timer=null;

  recBtn.onclick=async()=>{
    if(mr && mr.state==='recording'){mr.stop();return;}
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mr=new MediaRecorder(stream);chunks=[];
      mr.ondataavailable=e=>chunks.push(e.data);
      mr.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());clearInterval(timer);
        pendingBlob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
        const url=URL.createObjectURL(pendingBlob);
        preview.innerHTML=`<audio controls src="${url}" style="width:100%;margin-top:10px;height:38px"></audio>`;
        recBtn.classList.remove('on');
      };
      mr.start();recBtn.classList.add('on');t0=Date.now();
      timer=setInterval(()=>{const d=Math.floor((Date.now()-t0)/1000);
        recTime.textContent=`${String(Math.floor(d/60)).padStart(2,'0')}:${String(d%60).padStart(2,'0')}`;},250);
    }catch(e){alert('Micro indisponible. Autorisez l’accès au micro (et servez le site en HTTPS).');}
  };

  saveBtn.onclick=async()=>{
    const texte=txText.value.trim();
    if(!texte && !pendingBlob){return;}
    let audioId=null;
    if(pendingBlob){
      audioId=uid();
      const bytes=new Uint8Array(await pendingBlob.arrayBuffer());
      const enc=await encryptBytes(KEY,bytes);
      await idbSet('audio',audioId,{...enc,type:pendingBlob.type});
    }
    S.transmissions.push({id:uid(),patientId:pid,auteur:S.settings.moi||'',texte,audioId,createdAt:Date.now()});
    save();
    openPatient(pid); // recharge la fiche
  };
}

/* ---- Édition patient ---- */
function editPatient(id){
  const p = id?patient(id):{id:uid(),alertes:[]};
  const isNew=!id;
  const s=openSheet(`
    <div class="sheethead"><h2>${isNew?'Nouveau patient':'Modifier'}</h2>
      ${isNew?'':'<button class="btn sm danger" id="delPat">Supprimer</button>'}</div>
    <div class="grid2">
      <div class="field" style="margin-top:0"><label>Prénom</label><input id="f_prenom" value="${esc(p.prenom)}"></div>
      <div class="field" style="margin-top:0"><label>Nom</label><input id="f_nom" value="${esc(p.nom)}"></div>
    </div>
    <div class="field"><label>Adresse</label><input id="f_adresse" value="${esc(p.adresse)}"></div>
    <div class="grid2">
      <div class="field"><label>Latitude</label><input id="f_lat" inputmode="decimal" value="${esc(p.lat)}"></div>
      <div class="field"><label>Longitude</label><input id="f_lng" inputmode="decimal" value="${esc(p.lng)}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Code porte</label><input id="f_code" value="${esc(p.codePorte)}"></div>
      <div class="field"><label>Contact famille</label><input id="f_fam" value="${esc(p.telFamille)}"></div>
    </div>
    <div class="field"><label>Pathologies</label><textarea id="f_path">${esc(p.pathologies)}</textarea></div>
    <div class="field"><label>Soins en cours</label><textarea id="f_soins">${esc(p.soins)}</textarea></div>
    <div class="field"><label>Notes</label><textarea id="f_notes">${esc(p.notes)}</textarea></div>

    <div class="field"><label>Alertes</label>
      <div id="alertList"></div>
      <div class="row" style="margin-top:8px">
        <select id="a_niv" style="width:auto;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff">
          <option value="red">Critique</option><option value="amber">Précaution</option><option value="info">Info</option>
        </select>
        <input id="a_txt" placeholder="ex. Allergie pénicilline / Chien / Chute" style="flex:1;padding:11px;border:1px solid var(--line);border-radius:10px">
        <button class="btn sm" id="a_add">+</button>
      </div>
    </div>
    <button class="btn" id="savePat" style="margin-top:18px">Enregistrer</button>`);

  let alertes=[...(p.alertes||[])];
  const drawAlerts=()=>{const host=s.querySelector('#alertList');
    host.innerHTML=alertes.map((x,i)=>`<span class="chip ${x.niveau}" style="margin:4px 4px 0 0">${esc(x.texte)} <button data-da="${i}" style="color:inherit;font-weight:700">✕</button></span>`).join('');
    host.querySelectorAll('[data-da]').forEach(b=>b.onclick=()=>{alertes.splice(+b.dataset.da,1);drawAlerts();});};
  drawAlerts();
  s.querySelector('#a_add').onclick=()=>{const txt=s.querySelector('#a_txt').value.trim();if(!txt)return;
    alertes.push({niveau:s.querySelector('#a_niv').value,texte:txt});s.querySelector('#a_txt').value='';drawAlerts();};

  s.querySelector('#savePat').onclick=()=>{
    const g=id=>s.querySelector(id).value.trim();
    Object.assign(p,{prenom:g('#f_prenom'),nom:g('#f_nom'),adresse:g('#f_adresse'),
      lat:g('#f_lat'),lng:g('#f_lng'),codePorte:g('#f_code'),telFamille:g('#f_fam'),
      pathologies:g('#f_path'),soins:g('#f_soins'),notes:g('#f_notes'),alertes});
    if(isNew)S.patients.push(p);
    save();closeSheet();render();
  };
  const del=s.querySelector('#delPat');
  if(del)del.onclick=()=>{if(confirm('Supprimer ce patient et ses transmissions ?')){
    S.patients=S.patients.filter(x=>x.id!==id);
    S.transmissions=S.transmissions.filter(t=>t.patientId!==id);
    S.tournees.forEach(t=>t.stops=t.stops.filter(x=>x!==id));
    save();closeSheet();render();}};
}

async function exportBundle(msg){
  msg.textContent='Chiffrement en cours…';
  // rassembler audios
  const audios={};
  for(const k of await idbKeys('audio')){audios[k]=await idbGet('audio',k);}
  const salt=await idbGet('meta','salt');
  const payload=await encryptJSON(KEY,{state:S,audios});
  const bundle={app:'releve',v:1,salt:b64(salt),iv:payload.iv,ct:payload.ct,at:Date.now()};
  const blob=new Blob([JSON.stringify(bundle)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`releve_${todayISO()}.releve`;a.click();
  msg.textContent='Bundle exporté.';
}

async function importBundle(file,msg){
  if(!file)return;msg.textContent='Lecture…';
  try{
    const bundle=JSON.parse(await file.text());
    if(bundle.app!=='releve')throw 0;
    const key=await deriveKey(PASS,unb64(bundle.salt)); // même phrase secrète du cabinet
    const {state:inState,audios}=await decryptJSON(key,bundle.iv,bundle.ct);
    // fusion par id (union ; l’entrant complète l’existant)
    const mergeById=(a,b)=>{const m=new Map(a.map(x=>[x.id,x]));b.forEach(x=>m.set(x.id,x));return[...m.values()];};
    S.patients=mergeById(S.patients,inState.patients||[]);
    S.transmissions=mergeById(S.transmissions,inState.transmissions||[]);
    S.tournees=mergeById(S.tournees,inState.tournees||[]);
    if(!S.settings.cabinet && inState.settings)S.settings.cabinet=inState.settings.cabinet||'';
    for(const [k,v] of Object.entries(audios||{})){await idbSet('audio',k,v);}
    save();render();
    document.getElementById('cabName').textContent=S.settings.cabinet||'cabinet';
    msg.textContent='Import réussi et fusionné.';
  }catch(e){msg.textContent='Échec : fichier illisible ou phrase secrète différente.';}
}
